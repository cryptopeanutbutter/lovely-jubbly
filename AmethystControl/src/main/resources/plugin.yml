name: AmethystControl
version: '1.0-SNAPSHOT'
main: dev.lixqa.amethystControl.AmethystControl
api-version: '1.20'
author: Lixqa Development (https://lix.qa / https://discord.gg/ldev)

commands:
  spawncrystals:
    description: Spawns amethyst crystals manually.
    usage: /spawncrystals
    permission: amethystcontrol.spawn
    permission-message: You do not have permission to use this command.
  supply:
    description: Shows minted crystal supply.
    usage: /supply
    permission: amethystcontrol.supply
    permission-message: You do not have permission to use this command.
  redeem:
    description: Redeem the crystal in your hand.
    usage: /redeem
    permission: amethystcontrol.redeem
    permission-message: You do not have permission to use this command.

permissions:
  amethystcontrol.supply:
    description: Allows viewing the crystal supply ledger.
    default: true
  amethystcontrol.redeem:
    description: Allows redeeming and burning minted crystals.
    default: op
